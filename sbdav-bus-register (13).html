<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SBDAV Bus Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --ink:#33383F;
    --ink-2:#262A30;
    --paper:#F1F4F7;
    --card:#FFFFFF;
    --sky:#4FA8DA;
    --sky-deep:#2E86C1;
    --sky-pale:#E7F3FB;
    --present:#2E9E6B;
    --present-soft:#DDF0E7;
    --waiting:#E3A93A;
    --waiting-soft:#FBF0DA;
    --alert:#D8543F;
    --alert-soft:#FBE2DD;
    --grey:#6B7280;
    --grey-light:#A7AEB8;
    --line:#DCE2E8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:1180px;margin:0 auto;padding:0 20px 64px;}

  header.top{
    background:var(--ink); color:#fff; margin:0 -20px 28px; padding:22px 24px 0;
    border-radius:0 0 20px 20px;
  }
  .top-row{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-bottom:18px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:10px;background:var(--sky);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;color:#fff;font-size:15px;
    flex:none;
  }
  .brand-text h1{margin:0;font-size:19px;letter-spacing:0.2px;}
  .brand-text p{margin:2px 0 0;font-size:12.5px;color:#B7C0CA;}
  .header-actions{display:flex;align-items:center;gap:10px;}
  .switch-app{
    border:1px solid rgba(255,255,255,0.25); background:transparent;color:#E4E9EF;
    padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Inter';
  }
  .switch-app:hover{background:rgba(255,255,255,0.08);}

  .subtabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .subtabs button{
    border:1px solid var(--line); background:var(--card); color:var(--grey);
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter';
  }
  .subtabs button.active{background:var(--sky);border-color:var(--sky);color:#fff;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .card h2{margin:0 0 4px;font-size:17px;}
  .card .sub{color:var(--grey);font-size:13px;margin:0 0 16px;}
  .grid-2{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;}
  @media (max-width:820px){.grid-2{grid-template-columns:1fr;}}

  label{font-size:12.5px;font-weight:600;color:var(--grey);display:block;margin-bottom:5px;}
  input[type=text], input[type=email], input[type=password], input[type=date], select, textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
    font-family:'Inter';font-size:13.5px;background:#fff;color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--sky-deep);outline-offset:0;}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:140px;}

  .btn{
    border:none;border-radius:9px;padding:9px 16px;font-weight:600;font-size:13.5px;
    cursor:pointer;font-family:'Inter';display:inline-flex;align-items:center;gap:6px;
  }
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{background:var(--ink-2);}
  .btn-sky{background:var(--sky);color:#fff;}
  .btn-sky:hover{background:var(--sky-deep);}
  .btn-ghost{background:transparent;color:var(--grey);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--grey);}
  .btn-danger{background:var(--alert-soft);color:var(--alert);}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--grey);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
     border-bottom:1px solid var(--line);padding:8px 8px;}
  td{padding:9px 8px;border-bottom:1px solid #ECEFF2;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;}
  .pill-route{background:var(--sky-pale);color:var(--sky-deep);}
  .admno{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--grey);}
  .empty{color:var(--grey-light);font-size:13px;padding:18px 4px;text-align:center;}

  .journey{display:flex;align-items:center;margin:10px 0 4px;}
  .j-node{display:flex;flex-direction:column;align-items:center;width:120px;text-align:center;}
  .j-dot{width:16px;height:16px;border-radius:50%;background:var(--grey-light);margin-bottom:6px;position:relative;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line);}
  .j-node.done .j-dot{background:var(--present);box-shadow:0 0 0 2px var(--present);}
  .j-node.excused .j-dot{background:#8A97AC;box-shadow:0 0 0 2px #8A97AC;}
  .j-node.missed .j-dot{background:var(--alert);box-shadow:0 0 0 2px var(--alert);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(216,84,63,.5);}70%{box-shadow:0 0 0 8px rgba(216,84,63,0);}100%{box-shadow:0 0 0 0 rgba(216,84,63,0);}}
  .j-label{font-size:12px;font-weight:600;color:var(--grey);}
  .j-node.done .j-label, .j-node.excused .j-label{color:var(--ink);}
  .j-time{display:block;font-family:'IBM Plex Mono';font-size:10.5px;font-weight:400;color:var(--grey-light);margin-top:1px;}
  .j-line{flex:1;height:2px;background:var(--line);margin:0 -4px 22px;}
  .j-line.filled{background:var(--present);}

  .status-banner{border-radius:11px;padding:12px 16px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin-top:4px;}
  .status-present{background:var(--present-soft);color:var(--present);}
  .status-waiting{background:var(--waiting-soft);color:#8A6300;}
  .status-alert{background:var(--alert-soft);color:var(--alert);}
  .status-idle{background:#EDEFF2;color:var(--grey);}
  .status-excused{background:#E7ECF3;color:#3E4A63;}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:10.5px;color:var(--grey-light);text-align:center;font-weight:700;text-transform:uppercase;}
  .cal-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-family:'IBM Plex Mono';border:1px solid var(--line);background:#fff;color:var(--grey);cursor:default;}
  .cal-cell.blank{border:none;background:transparent;}
  .cal-cell.present{background:var(--present);color:#fff;border-color:var(--present);}
  .cal-cell.bunk{background:var(--alert);color:#fff;border-color:var(--alert);}
  .cal-cell.waiting{background:var(--waiting);color:#fff;border-color:var(--waiting);}
  .cal-cell.excused{background:#C7D0DC;color:#33383F;border-color:#C7D0DC;}
  .cal-cell.today-ring{box-shadow:0 0 0 2px var(--ink);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--grey);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

  .alert-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid #ECEFF2;}
  .alert-row:last-child{border-bottom:none;}
  .alert-left{display:flex;align-items:center;gap:10px;}
  .alert-dot{width:9px;height:9px;border-radius:50%;background:var(--alert);flex:none;}
  .alert-resolved .alert-dot{background:var(--grey-light);}
  .alert-resolved{opacity:.55;}
  .alert-meta{font-size:12px;color:var(--grey);}

  .banner-info{background:var(--sky-pale);border:1px solid #CFE6F5;color:#1E5A80;border-radius:11px;padding:10px 14px;font-size:12.5px;margin-bottom:18px;}
  .banner-info b{color:#123C56;}

  .toggle-row{display:flex;align-items:center;gap:10px;}
  .switch{position:relative;width:44px;height:24px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:var(--line);border-radius:999px;cursor:pointer;transition:.15s;}
  .slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
  .switch input:checked + .slider{background:var(--present);}
  .switch input:checked + .slider:before{transform:translateX(20px);}
  .switch input:disabled + .slider{opacity:.5;cursor:not-allowed;}

  .muted{color:var(--grey-light);font-size:12px;}
  .flex-between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .stat-box{background:var(--sky-pale);border-radius:12px;padding:14px;text-align:center;}
  .stat-box .num{font-family:'Space Grotesk';font-size:26px;font-weight:700;color:var(--ink);line-height:1.1;}
  .stat-box .lbl{font-size:11.5px;color:var(--grey);margin-top:4px;}
  .stat-box.alert-stat{background:var(--alert-soft);}
  .stat-box.alert-stat .num{color:var(--alert);}
  .stat-box.waiting-stat{background:var(--waiting-soft);}
  .stat-box.waiting-stat .num{color:#8A6300;}
  details.danger{margin-top:6px;}
  details.danger summary{cursor:pointer;color:var(--grey-light);font-size:12px;}

  .chooser-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(240px,1fr));gap:18px;margin-top:6px;}
  .chooser-card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;cursor:pointer;
    transition:.15s; text-align:left;
  }
  .chooser-card:hover{border-color:var(--sky-deep); box-shadow:0 4px 18px rgba(46,134,193,0.12);}
  .chooser-icon{width:46px;height:46px;border-radius:12px;background:var(--sky-pale);color:var(--sky-deep);
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .chooser-icon svg{width:22px;height:22px;}
  .status-banner svg{width:18px;height:18px;flex:none;}
  .chooser-card h3{margin:0 0 6px;font-size:17px;}
  .chooser-card p{margin:0;font-size:13px;color:var(--grey);line-height:1.5;}

  .login-wrap{max-width:380px;margin:30px auto 0;}
  .login-error{color:var(--alert);font-size:12.5px;margin-top:6px;}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:40px;}
  .pw-toggle{
    position:absolute;right:9px;top:50%;transform:translateY(-50%);
    background:none;border:none;padding:4px;cursor:pointer;color:var(--grey-light);
    display:flex;align-items:center;justify-content:center;
  }
  .pw-toggle:hover{color:var(--grey);}
  .pw-toggle svg{width:18px;height:18px;}
  .child-card{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .child-avatar{width:44px;height:44px;border-radius:50%;background:var(--sky-pale);color:var(--sky-deep);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk';flex:none;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-row" id="headerRow"></div>
  </header>
  <div id="mainBanner"></div>
  <main id="main"></main>
</div>

<script>
/* ---------------- Firebase setup ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDUJYoPhYt0vnQNLskj05ixvcrekH-aOSw",
  authDomain: "sbdav-bus-attendance.firebaseapp.com",
  projectId: "sbdav-bus-attendance",
  storageBucket: "sbdav-bus-attendance.firebasestorage.app",
  messagingSenderId: "333086778097",
  appId: "1:333086778097:web:4730810b1713771bce7f50",
  measurementId: "G-VG6N18GYJ7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
// Secondary app instance: creating a new Auth user normally signs the browser in as
// that new user, which would kick the signed-in principal out. Running account
// creation through a second, separate Firebase app avoids disturbing the main session.
const secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary');
const secondaryAuth = secondaryApp.auth();

/* ---------------- Firestore data layer ---------------- */
function attKey(admissionNo, date){ return admissionNo + '__' + date; }

async function getStudents(){
  try{
    const snap = await db.collection('students').get();
    return snap.docs.map(d => ({id:d.id, ...d.data()}));
  }catch(e){ console.error('getStudents failed', e); return []; }
}
async function getStudentsByRoute(route){
  try{
    const snap = await db.collection('students').where('route','==',route).get();
    return snap.docs.map(d => ({id:d.id, ...d.data()}));
  }catch(e){ console.error('getStudentsByRoute failed', e); return []; }
}
async function getVanStudents(){
  try{
    const snap = await db.collection('students').where('commute','==','van').get();
    return snap.docs.map(d => ({id:d.id, ...d.data()}));
  }catch(e){ console.error('getVanStudents failed', e); return []; }
}
async function getStudentsByClassName(className){
  try{
    const snap = await db.collection('students').where('className','==',className).get();
    return snap.docs.map(d => ({id:d.id, ...d.data()}));
  }catch(e){ console.error('getStudentsByClassName failed', e); return []; }
}
async function getStudentByAdmissionNo(admissionNo){
  try{
    const doc = await db.collection('students').doc(admissionNo).get();
    return doc.exists ? {id:doc.id, ...doc.data()} : null;
  }catch(e){ console.error('getStudentByAdmissionNo failed', e); return null; }
}
async function saveStudent(student){
  try{
    await db.collection('students').doc(student.admissionNo).set(student);
    return true;
  }catch(e){ console.error('saveStudent failed', e); return false; }
}
async function deleteStudentDoc(admissionNo){
  try{ await db.collection('students').doc(admissionNo).delete(); return true; }
  catch(e){ console.error('deleteStudentDoc failed', e); return false; }
}
async function getRoutes(){
  try{
    const snap = await db.collection('routes').get();
    return snap.docs.map(d => d.id);
  }catch(e){ console.error('getRoutes failed', e); return []; }
}
async function ensureRoute(name){
  try{ await db.collection('routes').doc(name).set({name}, {merge:true}); return true; }
  catch(e){ console.error('ensureRoute failed', e); return false; }
}
async function getAttendance(admissionNo, date){
  try{
    const doc = await db.collection('attendance').doc(attKey(admissionNo, date)).get();
    return doc.exists ? doc.data() : {};
  }catch(e){ console.error('getAttendance failed', e); return {}; }
}
async function setAttendance(admissionNo, date, patch){
  try{
    await db.collection('attendance').doc(attKey(admissionNo, date))
      .set({admissionNo, date, ...patch}, {merge:true});
    return true;
  }catch(e){ console.error('setAttendance failed', e); return false; }
}
async function getAttendanceForStudent(admissionNo){
  try{
    const snap = await db.collection('attendance').where('admissionNo','==',admissionNo).get();
    const map = {};
    snap.forEach(d => { map[d.data().date] = d.data(); });
    return map;
  }catch(e){ console.error('getAttendanceForStudent failed', e); return {}; }
}
async function getAlerts(){
  try{
    const snap = await db.collection('alerts').orderBy('ts','desc').get();
    return snap.docs.map(d => ({id:d.id, ...d.data()}));
  }catch(e){ console.error('getAlerts failed', e); return []; }
}
async function addAlert(alert){
  try{ await db.collection('alerts').add(alert); return true; }
  catch(e){ console.error('addAlert failed', e); return false; }
}
async function setAlertById(id, alert){
  try{ await db.collection('alerts').doc(id).set(alert, {merge:true}); return true; }
  catch(e){ console.error('setAlertById failed', e); return false; }
}
async function resolveAlertDoc(id){
  try{ await db.collection('alerts').doc(id).update({resolved:true}); return true; }
  catch(e){ console.error('resolveAlertDoc failed', e); return false; }
}
async function getClassAttendance(admissionNo, date){
  try{
    const doc = await db.collection('classAttendance').doc(attKey(admissionNo, date)).get();
    return doc.exists ? doc.data() : {};
  }catch(e){ console.error('getClassAttendance failed', e); return {}; }
}
async function setClassAttendance(admissionNo, date, patch){
  try{
    await db.collection('classAttendance').doc(attKey(admissionNo, date))
      .set({admissionNo, date, ...patch}, {merge:true});
    return true;
  }catch(e){ console.error('setClassAttendance failed', e); return false; }
}
async function wipeEverything(){
  try{
    const cols = ['students','routes','attendance','alerts'];
    for(const col of cols){
      const snap = await db.collection(col).get();
      const batchArr = snap.docs;
      for(let i=0;i<batchArr.length;i+=400){
        const batch = db.batch();
        batchArr.slice(i,i+400).forEach(d => batch.delete(d.ref));
        await batch.commit();
      }
    }
    return true;
  }catch(e){ console.error('wipeEverything failed', e); return false; }
}

/* ---------------- utils ---------------- */
function todayStr(){
  const d = new Date();
  const tz = d.getTimezoneOffset()*60000;
  return new Date(d - tz).toISOString().slice(0,10);
}
function nowTime(){
  const d = new Date();
  return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDateLabel(dstr){
  const [y,m,d] = dstr.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString([], {weekday:'short', month:'short', day:'numeric', year:'numeric'});
}
function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('');
}
function sanitizeAdm(v){ return String(v||'').trim().replace(/[\/\.\#\$\[\]]/g,'-'); }

/* ---------------- icons ---------------- */
const ICON = {
  bus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="11" rx="2.2"></rect><line x1="3" y1="10.2" x2="21" y2="10.2"></line><line x1="8" y1="5" x2="8" y2="10.2"></line><line x1="14" y1="5" x2="14" y2="10.2"></line><circle cx="7.2" cy="18" r="1.6"></circle><circle cx="16.8" cy="18" r="1.6"></circle></svg>`,
  parent: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"></path></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.6 2.6 5-5.6"></path></svg>`,
  alert: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9.2 16.2H2.8z"></path><line x1="12" y1="9.5" x2="12" y2="13.8"></line><circle cx="12" cy="16.8" r="0.9" fill="currentColor" stroke="none"></circle></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.2v5l3.4 2"></path></svg>`,
  dash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="8.5" y1="12" x2="15.5" y2="12"></line></svg>`,

async function getStaffRoleDoc(uid){
  try{
    const doc = await db.collection('staffRoles').doc(uid).get();
    return doc.exists ? doc.data() : {};
  }catch(e){ console.error('getStaffRoleDoc failed', e); return {}; }
}
async function listStaffRoles(){
  try{
    const snap = await db.collection('staffRoles').get();
    return snap.docs.map(d => ({uid:d.id, ...d.data()}));
  }catch(e){ console.error('listStaffRoles failed', e); return []; }
}
async function setStaffRole(uid, role, email, restrictToRoute){
  try{
    await db.collection('staffRoles').doc(uid).set({role, email, restrictToRoute: restrictToRoute || ''}, {merge:true});
    return true;
  }catch(e){ console.error('setStaffRole failed', e); return false; }
}
async function createStaffAccount(email, password, role, restrictToRoute){
  // Create the login on the secondary app instance so the principal stays signed in
  // on the primary one, then write the role using the primary (authenticated) session.
  const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
  const uid = cred.user.uid;
  await secondaryAuth.signOut();
  await setStaffRole(uid, role, email, restrictToRoute);
  return uid;
}

auth.onAuthStateChanged(async user => {
  state.staffUser = user;
  if(user){
    const roleDoc = await getStaffRoleDoc(user.uid);
    state.staffRole = roleDoc.role || 'staff';
    state.staffRestrictedRoute = roleDoc.restrictToRoute || null;
    state.staffTab = 'roster';
    if(state.staffRestrictedRoute) state.conductorRoute = state.staffRestrictedRoute;
  } else {
    state.staffRole = null;
    state.staffRestrictedRoute = null;
  }
  render();
});

async function render(){

}

async function renderPrincipalDashboard(){
  const students = await getStudents();
  const today = todayStr();
  const routes = await getRoutes();
  const allRouteNames = Array.from(new Set([...routes, ...students.map(s=>s.route).filter(Boolean)])).sort();

  const counts = {boarded:0, arrived:0, missed:0, dropped:0, absent:0, unaccounted:0, waiting:0, none:0};
  const routeSummary = {};
  allRouteNames.forEach(r => routeSummary[r] = {total:0, present:0, waiting:0, unaccounted:0});
  let gateTotal = 0, gatePresent = 0, gateWaiting = 0, gateUnaccounted = 0;

  for(const s of students){
    const rec = await getAttendance(s.admissionNo, today);
    const bucket = rec.status ? rec.status : (rec.left ? 'waiting' : 'none');
    counts[bucket] = (counts[bucket]||0) + 1;

    const commute = s.commute || 'bus';
    if(commute === 'bus'){
      const r = s.route;
      if(r && routeSummary[r]){
        routeSummary[r].total++;
        if(bucket === 'boarded') routeSummary[r].present++;
        if(bucket === 'waiting') routeSummary[r].waiting++;
        if(bucket === 'unaccounted') routeSummary[r].unaccounted++;
      }
    } else {
      gateTotal++;
      if(bucket === 'arrived') gatePresent++;
      if(bucket === 'waiting') gateWaiting++;
      if(bucket === 'unaccounted') gateUnaccounted++;
    }
  }

  const alerts = await getAlerts();
  const openAlerts = alerts.filter(a => !a.resolved).sort((a,b)=> b.ts - a.ts);
  const totalUnaccounted = counts.unaccounted;
  const totalWaiting = counts.waiting;

  return `
  <div class="card">
    <h2>Today at a glance — ${fmtDateLabel(today)}</h2>
    <p class="sub">A school-wide snapshot across every bus route and the gate, not just one at a time.</p>
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${students.length}</div><div class="lbl">Total students</div></div>
      <div class="stat-box"><div class="num">${allRouteNames.length}</div><div class="lbl">Bus routes</div></div>
      <div class="stat-box waiting-stat"><div class="num">${totalWaiting}</div><div class="lbl">Awaiting confirmation</div></div>
      <div class="stat-box alert-stat"><div class="num">${totalUnaccounted}</div><div class="lbl">Unaccounted today</div></div>
      <div class="stat-box alert-stat"><div class="num">${openAlerts.length}</div><div class="lbl">Open alerts</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Bus routes</h2>
    <p class="sub">Boarded / awaiting / unaccounted, out of each route's total students, for today.</p>
    ${allRouteNames.length===0 ? '<div class="empty">No routes set up yet.</div>' : `
    <table>
      <thead><tr><th>Route</th><th>Students</th><th>Boarded</th><th>Awaiting</th><th>Unaccounted</th></tr></thead>
      <tbody>
        ${allRouteNames.map(r=>{
          const rs = routeSummary[r];
          return `<tr>
            <td>${esc(r)}</td>
            <td>${rs.total}</td>
            <td>${rs.present}</td>
            <td>${rs.waiting}</td>
            <td>${rs.unaccounted ? `<span class="pill" style="background:var(--alert-soft);color:var(--alert);">${rs.unaccounted}</span>` : '0'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`}
  </div>

  <div class="card">
    <h2>Van &amp; walking students</h2>
    <p class="sub">${gateTotal} student${gateTotal===1?'':'s'} travel by private van or on foot.</p>
    <div class="stat-grid" style="margin-bottom:0;">
      <div class="stat-box"><div class="num">${gatePresent}</div><div class="lbl">Arrived</div></div>
      <div class="stat-box waiting-stat"><div class="num">${gateWaiting}</div><div class="lbl">Awaiting</div></div>
      <div class="stat-box alert-stat"><div class="num">${gateUnaccounted}</div><div class="lbl">Unaccounted</div></div>
    </div>
  </div>

  <div class="card">
    <div class="flex-between">
      <h2 style="margin:0;">Open alerts</h2>
      ${openAlerts.length ? `<button class="btn btn-ghost btn-sm" id="jumpToAlertsBtn">View all in Alerts tab</button>` : ''}
    </div>
    ${openAlerts.length===0 ? '<div class="empty">No open alerts. All clear.</div>' : openAlerts.slice(0,5).map(a=>`
      <div class="alert-row">
        <div class="alert-left">
          <span class="alert-dot"></span>
          <div>
            <div><b>${esc(a.studentName)}</b>${a.admissionNo?` <span class="admno">(#${esc(a.admissionNo)})</span>`:''} — ${a.kind==='transport_but_absent' ? 'reached school but absent in class' : 'unaccounted'}</div>
            <div class="alert-meta">${esc(a.route||'No route')} · ${fmtDateLabel(a.date)} · flagged at ${esc(a.time)}</div>
          </div>
        </div>
      </div>`).join('')}
  </div>`;
}

function commuteCell(s, allRouteNames, readOnly){
  if(s.commute === 'van') return `<span class="pill" style="background:#EEE9F8;color:#5B3FA8;">Private van</span><div class="muted">${esc(s.vanInfo||'')}</div>`;
  if(s.commute === 'foot') return `<span class="pill" style="background:#F1F3F5;color:var(--grey);">Walks / dropped off</span>`;
  if(readOnly) return s.route ? `<span class="pill pill-route">${esc(s.route)}</span>` : '<span class="muted">Not assigned</span>';
  return `<select data-student-route="${esc(s.admissionNo)}" style="width:auto;min-width:150px;">
      <option value="">— none —</option>
      ${allRouteNames.map(r=>`<option value="${esc(r)}" ${s.route===r?'selected':''}>${esc(r)}</option>`).join('')}
    </select>`;
}

async function renderLookup(){
  const q = (state.lookupQuery||'').trim();
  let results = [];
  if(q){
    const exact = await getStudentByAdmissionNo(sanitizeAdm(q));
    if(exact) results = [exact];
    else{
      const all = await getStudents();
      results = all.filter(s => (s.name||'').toLowerCase().includes(q.toLowerCase()));
    }
  }

  return `
  <div class="card">
    <h2>Bus info lookup</h2>
    <p class="sub">Search by name, or by admission number when several students share a name.</p>
    <div class="row" style="max-width:480px;">
      <input type="text" id="lookupInput" placeholder="Name or admission number" value="${esc(state.lookupQuery)}">
      <button class="btn btn-sky" id="lookupBtn" style="flex:none;">Search</button>
    </div>

    ${!q ? '<div class="empty">Type a name or admission number to see which bus a student is on.</div>' : ''}
    ${q && results.length===0 ? '<div class="empty">No student matches that search.</div>' : ''}
    ${q && results.length > 1 ? `<p class="muted" style="margin-top:14px;">Multiple students named "${esc(q)}" — check the admission number from the school's documents to pick the right one.</p>` : ''}

    ${results.length ? `
      <table style="margin-top:14px;">
        <thead><tr><th>Name</th><th>Adm. No.</th><th>Class</th><th>Bus / Route</th><th>Stop / Area</th></tr></thead>
        <tbody>
          ${results.map(s=>`
            <tr>
              <td>${esc(s.name)}</td>
              <td class="admno">${esc(s.admissionNo||'—')}</td>
              <td>${esc(s.className||'—')}</td>
              <td>${commuteCell(s, [], true)}</td>
              <td>${esc(s.area||'—')}</td>
            </tr>`).join('')}
        </tbody>
      </table>` : ''}
  </div>`;
}

async function renderBoarding(locked){
  let allRouteNames = [];
  if(!locked){
    const routes = await getRoutes();
    const students = await getStudents();
    allRouteNames = Array.from(new Set([...routes, ...students.map(s=>s.route).filter(Boolean)])).sort();
    if(!state.conductorRoute && allRouteNames.length) state.conductorRoute = allRouteNames[0];
  }

  const picker = `
    <div class="card">
      <div class="flex-between">
        <div>
          <h2>Boarding — ${fmtDateLabel(todayStr())}</h2>
          <p class="sub">Confirm who actually boarded the bus on each route today.</p>
        </div>
        ${locked ? `<span class="pill pill-route">${esc(state.conductorRoute)}</span>` : `
        <select id="conductorRouteSelect" style="width:auto;min-width:200px;">
          ${allRouteNames.length===0 ? '<option>No routes yet</option>' :
            allRouteNames.map(r=>`<option value="${esc(r)}" ${r===state.conductorRoute?'selected':''}>${esc(r)}</option>`).join('')}
        </select>`}
      </div>
    </div>`;

  if(!state.conductorRoute) return picker + `<div class="card"><div class="empty">Set up routes under Students &amp; Buses first.</div></div>`;

  const routeStudents = await getStudentsByRoute(state.conductorRoute);
  const today = todayStr();

  const rows = [];
  for(const s of routeStudents){
    const rec = await getAttendance(s.admissionNo, today);
    rows.push({s, rec});
  }

  const pendingBunks = rows.filter(r=>r.rec.left && !r.rec.status).length;

  const statusOptions = (current)=>`
    <option value="" ${!current?'selected':''}>— not marked —</option>
    <option value="boarded" ${current==='boarded'?'selected':''}>Boarded</option>
    <option value="missed" ${current==='missed'?'selected':''}>Missed the bus</option>
    <option value="dropped" ${current==='dropped'?'selected':''}>Dropped by parent</option>
    <option value="absent" ${current==='absent'?'selected':''}>Absent today</option>`;

  return picker + `
  <div class="card">
    <div class="flex-between">
      <div>
        <h2>${esc(state.conductorRoute)}</h2>
        <p class="sub">${routeStudents.length} student${routeStudents.length===1?'':'s'} on this route today</p>
      </div>
      <button class="btn btn-sky btn-sm" id="bunkCheckBtn" ${pendingBunks===0?'disabled':''}>Run bunk check${pendingBunks?` (${pendingBunks})`:''}</button>
    </div>
    <table>
      <thead><tr><th>Student</th><th>Adm. No.</th><th>Left for stop</th><th>Outcome</th><th></th></tr></thead>
      <tbody>
        ${rows.length===0 ? '' : rows.map(({s,rec})=>`
          <tr>
            <td>${esc(s.name)}<div class="muted">${esc(s.className||'')}</div></td>
            <td class="admno">${esc(s.admissionNo||'—')}</td>
            <td>${rec.left ? `<span class="pill" style="background:var(--present-soft);color:var(--present);">Left ${rec.leftTime?('· '+esc(rec.leftTime)):''}</span>` : '<span class="muted">Not yet</span>'}</td>
            <td>
              <select data-board-status="${esc(s.admissionNo)}" style="width:auto;min-width:170px;">
                ${statusOptions(rec.status)}
              </select>
            </td>
            <td>${rec.status==='unaccounted' ? '<span class="pill" style="background:var(--alert-soft);color:var(--alert);">Unaccounted</span>' : ''}</td>
          </tr>`).join('')}
      </tbody>
    </table>
    ${rows.length===0 ? '<div class="empty">No students on this route yet.</div>' : ''}
  </div>`;
}

async function renderVanCheckin(){
  const vanStudents = await getVanStudents();
  const today = todayStr();

  const groups = {};
  for(const s of vanStudents){
    const key = s.vanInfo || 'Unnamed van';
    if(!groups[key]) groups[key] = [];
    const rec = await getAttendance(s.admissionNo, today);
    groups[key].push({s, rec});
  }
  const groupNames = Object.keys(groups).sort();

  const statusOptions = (current)=>`
    <option value="" ${!current?'selected':''}>— not marked —</option>
    <option value="arrived" ${current==='arrived'?'selected':''}>Arrived at school</option>
    <option value="absent" ${current==='absent'?'selected':''}>Absent today</option>`;

  if(vanStudents.length===0){
    return `<div class="card"><h2>Van Check-In — ${fmtDateLabel(today)}</h2><div class="empty">No students travel by private van yet.</div></div>`;
  }

  return groupNames.map(vanName=>{
    const rows = groups[vanName];
    const pending = rows.filter(r=>r.rec.left && !r.rec.status).length;
    return `
    <div class="card">
      <div class="flex-between">
        <div>
          <h2>${esc(vanName)}</h2>
          <p class="sub">${rows.length} student${rows.length===1?'':'s'} · ${fmtDateLabel(today)}</p>
        </div>
        <button class="btn btn-sky btn-sm" data-van-check="${esc(vanName)}" ${pending===0?'disabled':''}>Run check${pending?` (${pending})`:''}</button>
      </div>
      <table>
        <thead><tr><th>Student</th><th>Adm. No.</th><th>Left home</th><th>Outcome</th><th></th></tr></thead>
        <tbody>
          ${rows.map(({s,rec})=>`
            <tr>
              <td>${esc(s.name)}<div class="muted">${esc(s.className||'')}</div></td>
              <td class="admno">${esc(s.admissionNo||'—')}</td>
              <td>${rec.left ? `<span class="pill" style="background:var(--present-soft);color:var(--present);">Left ${rec.leftTime?('· '+esc(rec.leftTime)):''}</span>` : '<span class="muted">Not yet</span>'}</td>
              <td>
                <select data-van-status="${esc(s.admissionNo)}" style="width:auto;min-width:160px;">
                  ${statusOptions(rec.status)}

              </td>
              <td>${rec.status==='unaccounted' ? '<span class="pill" style="background:var(--alert-soft);color:var(--alert);">Unaccounted</span>' : ''}</td>
            </tr>`).join('')}
        </tbody>

  }).join('');
}

async function renderClassAttendance(){
  const students = await getStudents();
  const allClasses = Array.from(new Set(students.map(s=>s.className).filter(Boolean))).sort();
  if(!state.classAttendanceClass && allClasses.length) state.classAttendanceClass = allClasses[0];

  const picker = `
    <div class="card">
      <h2>Class Attendance</h2>
      <p class="sub">Marking a student absent here is checked against today's transport record — if they reached school by bus or van but are absent in class, it's flagged immediately.</p>
      <div class="field" style="max-width:280px;">
        <label>Class</label>
        <select id="classAttendanceSelect">
          ${allClasses.length===0 ? '<option>No classes yet</option>' :
            allClasses.map(c=>`<option value="${esc(c)}" ${c===state.classAttendanceClass?'selected':''}>${esc(c)}</option>`).join('')}
        </select>
      </div>
    </div>`;

  if(!state.classAttendanceClass) return picker + `<div class="card"><div class="empty">Add students with a class first.</div></div>`;

  const classStudents = await getStudentsByClassName(state.classAttendanceClass);
  const today = todayStr();

  const rows = [];
  for(const s of classStudents){
    const transportRec = await getAttendance(s.admissionNo, today);
    const classRec = await getClassAttendance(s.admissionNo, today);
    rows.push({s, transportRec, classRec});
  }
  rows.sort((a,b)=> (a.s.name||'').localeCompare(b.s.name||''));

  function transportPill(s, rec){
    const commute = s.commute || 'bus';
    if(commute === 'foot') return '<span class="muted">Walks / dropped off</span>';
    const label = commute === 'bus'
      ? (rec.status==='boarded' ? 'Boarded' : (rec.left ? 'Left, not yet boarded' : 'Not checked in'))
      : (rec.status==='arrived' ? 'Arrived' : (rec.left ? 'Left, not yet arrived' : 'Not checked in'));
    const cls = (rec.status==='boarded' || rec.status==='arrived') ? 'present-soft' : (rec.status==='unaccounted' ? 'alert-soft' : null);
    if(!cls) return `<span class="muted">${esc(label)}</span>`;
    const color = rec.status==='unaccounted' ? 'var(--alert)' : 'var(--present)';
    return `<span class="pill" style="background:var(--${cls});color:${color};">${esc(label)}</span>`;
  }

  return picker + `
  <div class="card">
    <h2>${esc(state.classAttendanceClass)} — ${fmtDateLabel(today)}</h2>
    <table>
      <thead><tr><th>Student</th><th>Adm. No.</th><th>Reached school (transport)</th><th>Class attendance</th></tr></thead>
      <tbody>
        ${rows.length===0 ? '' : rows.map(({s,transportRec,classRec})=>`
          <tr>
            <td>${esc(s.name)}</td>
            <td class="admno">${esc(s.admissionNo||'—')}</td>
            <td>${transportPill(s, transportRec)}</td>
            <td>
              <select data-class-attendance="${esc(s.admissionNo)}" style="width:auto;min-width:150px;">
                <option value="" ${classRec.present===undefined?'selected':''}>— not marked —</option>
                <option value="present" ${classRec.present===true?'selected':''}>Present</option>
                <option value="absent" ${classRec.present===false?'selected':''}>Absent</option>
              </select>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
    ${rows.length===0 ? '<div class="empty">No students in this class.</div>' : ''}
  </div>`;
}

/* ================= PARENT APP ================= */
async function renderParent(){
  if(!state.parentLoggedInId) return renderParentLogin();

  const student = await getStudentByAdmissionNo(state.parentLoggedInId);
  if(!student){ state.parentLoggedInId = null; return renderParentLogin(); }

  const headerCard = `
  <div class="card">
    <div class="flex-between">
      <div class="child-card">
        <div class="child-avatar">${esc(initials(student.name))}</div>
        <div>
          <h2 style="margin:0;">${esc(student.name)}</h2>
          <p class="sub" style="margin:2px 0 0;">${esc(student.className||'')} · Adm. No. ${esc(student.admissionNo||'—')} · ${commuteSummary(student)}</p>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="parentLogoutBtn">Log out</button>
    </div>
  </div>`;

  const commute = student.commute || 'bus';

  if(commute === 'foot'){
    return headerCard + `
    <div class="card">
      <h2>Bus check-in isn't tracked here</h2>
      <p class="sub">${esc(student.name)} walks or is dropped off, so there's no bus stop or check-in to log for them.</p>
      <p class="sub" style="margin-top:10px;">Arrival tracking for walking students isn't built yet.</p>
    </div>`;
  }

  const labels = commuteLabels(commute);
  const today = todayStr();
  const rec = await getAttendance(student.admissionNo, today);

  const journey = journeyTracker(rec, commute);
  let banner;
  if(rec.status && BOARD_STATUS[rec.status] && BOARD_STATUS[rec.status].calClass === 'present'){
    banner = `<div class="status-banner status-present">${ICON.check}<span>${esc(BOARD_STATUS[rec.status].label)} today${rec.boardTime?` at ${esc(rec.boardTime)}`:''}. All good.</span></div>`;
  } else if(rec.status === 'unaccounted'){
    banner = `<div class="status-banner status-alert">${ICON.alert}<span>${esc(labels.alertText)}</span></div>`;
  } else if(rec.status && BOARD_STATUS[rec.status]){
    banner = `<div class="status-banner status-excused">${ICON.info}<span>${esc(BOARD_STATUS[rec.status].label)} — logged by the school.</span></div>`;
  } else if(rec.left){
    banner = `<div class="status-banner status-waiting">${ICON.clock}<span>${esc(labels.waitingText)}</span></div>`;
  } else {
    banner = `<div class="status-banner status-idle">${ICON.dash}<span>Not checked in yet today.</span></div>`;
  }

  return headerCard + `
  <div class="card">
    <h2>Today's journey — ${fmtDateLabel(today)}</h2>
    ${journey}
    ${banner}
    <div class="toggle-row" style="margin-top:16px;">
      <label class="switch">
        <input type="checkbox" id="leftToggle" ${rec.left?'checked':''} ${rec.status?'disabled':''}>
        <span class="slider"></span>
      </label>
      <div>
        <b>${esc(labels.leftLabel)}</b>
        <div class="muted">${rec.status ? 'The school has already logged today\'s outcome — no need to change this.' : esc(labels.leftHelpIdle)}</div>
      </div>
    </div>
  </div>
  <div class="card">${await renderCalendarBlock(student.admissionNo)}</div>`;
}

function commuteSummary(student){
  if(student.commute === 'van') return 'Private van' + (student.vanInfo ? ' · ' + esc(student.vanInfo) : '');
  if(student.commute === 'foot') return 'Walks / dropped off';
  return esc(student.route || 'Not yet assigned to a bus');
}

/* ---------------- shared bits ---------------- */
const BOARD_STATUS = {
  boarded:     {label: 'Boarded the bus',       calClass: 'present', nodeClass: 'done'},
  arrived:     {label: 'Arrived at school',     calClass: 'present', nodeClass: 'done'},
  missed:      {label: 'Missed the bus',        calClass: 'excused', nodeClass: 'excused'},
  dropped:     {label: 'Dropped by parent',     calClass: 'excused', nodeClass: 'excused'},
  absent:      {label: 'Absent today',          calClass: 'excused', nodeClass: 'excused'},
  unaccounted: {label: 'Unaccounted — flagged', calClass: 'bunk',    nodeClass: 'missed'},
};

function commuteLabels(commute){
  if(commute !== 'bus'){
    return {
      leftLabel: 'My child has left home',
      leftHelpIdle: "Turn this on the moment they leave the house. The school gate confirms arrival on their end.",
      defaultNodeLabel: 'Arrived at school',
      waitingText: 'Waiting for the school gate to confirm arrival…',
      alertText: 'Marked left home but never checked in at the gate — the school has been alerted.',
    };
  }
  return {
    leftLabel: 'My child has left for the bus stop',
    leftHelpIdle: "Turn this on the moment they leave the house. The conductor confirms boarding on their end.",
    defaultNodeLabel: 'Boarded bus',
    waitingText: 'Waiting for the conductor to confirm boarding…',
    alertText: 'Marked left for the stop but never boarded — the school has been alerted.',
  };
}

function journeyTracker(rec, commute){
  const left = !!rec.left;
  const info = rec.status ? BOARD_STATUS[rec.status] : null;
  const n2class = info ? info.nodeClass : 'pending';
  const n2label = info ? info.label : commuteLabels(commute).defaultNodeLabel;
  return `
  <div class="journey">
    <div class="j-node ${left?'done':'pending'}">
      <div class="j-dot"></div>
      <div class="j-label">${commute==='bus'?'Left for stop':'Left home'}${rec.leftTime?`<span class="j-time">${esc(rec.leftTime)}</span>`:''}</div>
    </div>
    <div class="j-line ${left?'filled':''}"></div>
    <div class="j-node ${n2class}">
      <div class="j-dot"></div>
      <div class="j-label">${esc(n2label)}${rec.boardTime && info && info.calClass==='present'?`<span class="j-time">${esc(rec.boardTime)}</span>`:''}</div>
    </div>
  </div>`;
}

function dayStatus(rec, dateStr, todayS){
  if(!rec) return 'none';
  if(rec.status) return BOARD_STATUS[rec.status].calClass;
  if(rec.left && dateStr === todayS) return 'waiting';
  if(rec.left && dateStr < todayS) return 'bunk';
  return 'none';
}

async function renderCalendarBlock(admissionNo){
  const att = await getAttendanceForStudent(admissionNo);
  const today = todayStr();
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const monthLabel = first.toLocaleDateString([], {month:'long', year:'numeric'});

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dstr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = att[dstr];
    const status = dayStatus(rec, dstr, today);
    const ring = dstr === today ? 'today-ring' : '';
    cells += `<div class="cal-cell ${status} ${ring}" title="${dstr}">${d}</div>`;
  }

  return `
    <h2>Attendance register</h2>
    <div class="cal-head">
      <button class="btn btn-ghost btn-sm" data-cal-nav="-1">← Prev</button>
      <b>${monthLabel}</b>
      <button class="btn btn-ghost btn-sm" data-cal-nav="1">Next →</button>
    </div>
    <div class="cal-grid">
      ${['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="legend">
      <span><i style="background:var(--present);"></i>Boarded</span>
      <span><i style="background:var(--waiting);"></i>Left, awaiting boarding</span>
      <span><i style="background:#C7D0DC;"></i>Missed / dropped off / absent</span>
      <span><i style="background:var(--alert);"></i>Unaccounted</span>
      <span><i style="background:#fff;border:1px solid var(--line);"></i>No record</span>
    </div>`;
}

/* ---------------- event wiring ---------------- */
function attachHandlers(){
  const main = document.getElementById('main');

  main.querySelectorAll('[data-choose]').forEach(c=>{
    c.onclick = ()=>{ state.appMode = c.dataset.choose; render(); };
  });

  const staffPwToggle = main.querySelector('#staffPwToggle');
  if(staffPwToggle) staffPwToggle.onclick = ()=>{
    const pwInput = main.querySelector('#staffPasswordInput');
    const showing = pwInput.type === 'text';
    pwInput.type = showing ? 'password' : 'text';
    staffPwToggle.innerHTML = showing ? ICON.eye : ICON.eyeOff;
    staffPwToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  };

  // staff login
  const staffLoginBtn = main.querySelector('#staffLoginBtn');
  if(staffLoginBtn) staffLoginBtn.onclick = async ()=>{
    const email = main.querySelector('#staffEmailInput').value.trim();
    const password = main.querySelector('#staffPasswordInput').value;
    if(!email || !password){ state.staffLoginError = 'Enter both email and password.'; render(); return; }
    staffLoginBtn.disabled = true;
    try{
      await auth.signInWithEmailAndPassword(email, password);
      state.staffLoginError = '';
    }catch(err){
      state.staffLoginError = `Sign-in failed: ${err.code || ''} ${err.message || ''}`.trim();
      render();
    }
  };

  const staffSignOutLink = main.querySelector('#staffSignOutLink');
  if(staffSignOutLink) staffSignOutLink.onclick = (e)=>{ e.preventDefault(); auth.signOut(); };

  main.querySelectorAll('[data-stab]').forEach(b=>{
    b.onclick = ()=>{ state.staffTab = b.dataset.stab; render(); };
  });

  const jumpToAlertsBtn = main.querySelector('#jumpToAlertsBtn');
  if(jumpToAlertsBtn) jumpToAlertsBtn.onclick = ()=>{ state.appMode = 'staff'; state.staffTab = 'alerts'; render(); };

  const createStaffBtn = main.querySelector('#createStaffBtn');
  if(createStaffBtn) createStaffBtn.onclick = async ()=>{
    const email = main.querySelector('#newStaffEmail').value.trim();
    const password = main.querySelector('#newStaffPassword').value;
    const role = main.querySelector('#newStaffRole').value;
    const restrictToRoute = main.querySelector('#newStaffRoute').value;
    const msgEl = main.querySelector('#createStaffMsg');
    if(!email || !password){ msgEl.innerHTML = '<p class="login-error">Enter both an email and a password.</p>'; return; }
    createStaffBtn.disabled = true;
    try{
      await createStaffAccount(email, password, role, restrictToRoute);
      msgEl.innerHTML = `<p class="sub" style="margin-top:8px;">Created ${esc(email)} as ${role}${restrictToRoute?` (restricted to ${esc(restrictToRoute)})`:''}.</p>`;
      render();
    }catch(err){
      msgEl.innerHTML = `<p class="login-error">Couldn't create that account — ${esc(err.message || 'check the email and password.')}</p>`;
      createStaffBtn.disabled = false;
    }
  };

  main.querySelectorAll('[data-staff-role]').forEach(sel=>{
    sel.onchange = async ()=>{
      const uid = sel.dataset.staffRole;
      const current = (await listStaffRoles()).find(s=>s.uid===uid);
      await setStaffRole(uid, sel.value, current ? current.email : '', current ? current.restrictToRoute : '');
      render();
    };
  });

  main.querySelectorAll('[data-staff-restrict]').forEach(sel=>{
    sel.onchange = async ()=>{
      const uid = sel.dataset.staffRestrict;
      const current = (await listStaffRoles()).find(s=>s.uid===uid);
      await setStaffRole(uid, current ? current.role : 'staff', current ? current.email : '', sel.value);
      render();
    };
  });

  const manualRouteSelect = main.querySelector('#manualRouteSelect');
  if(manualRouteSelect) manualRouteSelect.onchange = ()=>{ state.manualRouteChoice = manualRouteSelect.value; };

  // toggle bus/van blocks based on commute mode
  const stuCommute = main.querySelector('#stuCommute');
  const stuBusBlock = main.querySelector('#stuBusBlock');
  const stuVanBlock = main.querySelector('#stuVanBlock');
  if(stuCommute) stuCommute.onchange = ()=>{
    stuBusBlock.style.display = stuCommute.value === 'bus' ? '' : 'none';
    stuVanBlock.style.display = stuCommute.value === 'van' ? '' : 'none';
  };

  // add student
  const addBtn = main.querySelector('#addStudentBtn');
  if(addBtn) addBtn.onclick = async ()=>{
    const name = main.querySelector('#stuName').value.trim();
    const admissionNo = sanitizeAdm(main.querySelector('#stuAdm').value);
    if(!name){ alert('Please enter the student name.'); return; }
    if(!admissionNo){ alert('Please enter the admission number — it is what tells students with the same name apart.'); return; }
    const className = main.querySelector('#stuClass').value.trim();
    const parentName = main.querySelector('#stuParent').value.trim();
    const commute = main.querySelector('#stuCommute').value;

    let route = '', area = '', vanInfo = '';
    if(commute === 'bus'){
      const newRoute = main.querySelector('#stuNewRoute').value.trim();
      route = newRoute || main.querySelector('#stuRouteSelect').value || '';
      if(!route){ alert('Choose or create a bus/route for this student first.'); return; }
      area = main.querySelector('#stuArea').value.trim();
    } else if(commute === 'van'){
      vanInfo = main.querySelector('#stuVanInfo').value.trim();
    }

    const existing = await getStudentByAdmissionNo(admissionNo);
    if(existing){
      if(!confirm(`Admission number ${admissionNo} already belongs to ${existing.name}. Overwrite that record?`)) return;
    }
    await saveStudent({admissionNo, name, className, area, parentName, route, commute, vanInfo});
    if(route) await ensureRoute(route);
    render();
  };

  // import file
  const importFile = main.querySelector('#importFile');
  if(importFile) importFile.onchange = ()=>{
    const file = importFile.files[0];
    if(!file) return;
    const fileName = (file.name || '').toLowerCase();
    const isExcel = fileName.endsWith('.xlsx') || fileName.endsWith('.xls');

    const processRows = async (rows)=>{
      const newRoute = main.querySelector('#newRouteName')?.value.trim();
      const manualRoute = newRoute || state.manualRouteChoice || '';
      if(!manualRoute){ alert('Choose or create a bus/route for this import first.'); return; }
      let added = 0, skipped = 0;
      for(const row of rows){
        const parts = row.map(v => String(v ?? '').trim());
        if(parts.length < 1 || !parts[0]) continue;
        if(parts[0].toLowerCase() === 'name') continue;
        const [name, admissionNoRaw='', className='', area='', parentName=''] = parts;
        const admissionNo = sanitizeAdm(admissionNoRaw);
        if(!admissionNo){ skipped++; continue; }
        await saveStudent({admissionNo, name, className, area, parentName, route: manualRoute, commute: 'bus'});
        added++;
      }
      await ensureRoute(manualRoute);
      const preview = main.querySelector('#importPreview');
      if(preview) preview.innerHTML = `<p class="sub" style="margin-top:8px;">Imported ${added} student(s).${skipped?` Skipped ${skipped} row(s) missing an admission number.`:''}</p>`;
      render();
    };

    const reader = new FileReader();
    if(isExcel){
      reader.onload = async (e)=>{
        try{
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, {type:'array'});
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, {header:1, blankrows:false});
          await processRows(rows);
        }catch(err){
          console.error(err);
          alert("Could not read that Excel file. Make sure it's a valid .xlsx or .xls file.");
        }
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = async (e)=>{
        const text = e.target.result || '';
        const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
        const rows = lines.map(parseCsvLine);
        await processRows(rows);
      };
      reader.readAsText(file);
    }
  };

  main.querySelectorAll('[data-student-route]').forEach(sel=>{
    sel.onchange = async ()=>{
      const admissionNo = sel.dataset.studentRoute;
      const student = await getStudentByAdmissionNo(admissionNo);
      if(student){
        student.route = sel.value;
        await saveStudent(student);
        if(sel.value) await ensureRoute(sel.value);
      }
      render();
    };
  });

  main.querySelectorAll('[data-del-student]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('Remove this student from the roster?')) return;
      await deleteStudentDoc(btn.dataset.delStudent);
      render();
    };
  });

  const wipeBtn = main.querySelector('#wipeBtn');
  if(wipeBtn) wipeBtn.onclick = async ()=>{
    if(!confirm('This clears every student, route and attendance record for everyone using this app. Continue?')) return;
    await wipeEverything();
    render();
  };

  const lookupBtn = main.querySelector('#lookupBtn');
  const lookupInput = main.querySelector('#lookupInput');
  if(lookupBtn) lookupBtn.onclick = ()=>{ state.lookupQuery = lookupInput.value; render(); };
  if(lookupInput) lookupInput.onkeydown = (e)=>{ if(e.key==='Enter'){ state.lookupQuery = lookupInput.value; render(); } };

  main.querySelectorAll('[data-resolve-alert]').forEach(btn=>{
    btn.onclick = async ()=>{
      await resolveAlertDoc(btn.dataset.resolveAlert);
      render();
    };
  });

  // parent login
  const parentLoginBtn = main.querySelector('#parentLoginBtn');
  const parentAdmInput = main.querySelector('#parentAdmInput');
  if(parentLoginBtn) parentLoginBtn.onclick = async ()=>{
    const val = sanitizeAdm(parentAdmInput.value);
    state.parentLoginInput = parentAdmInput.value.trim();
    if(!val){ state.parentLoginError = 'Enter an admission number.'; render(); return; }
    const match = await getStudentByAdmissionNo(val);
    if(!match){ state.parentLoginError = 'No student found with that admission number. Double-check the documents from the school.'; render(); return; }
    state.parentLoginError = '';
    state.parentLoggedInId = match.admissionNo;
    render();
  };
  if(parentAdmInput) parentAdmInput.onkeydown = (e)=>{ if(e.key==='Enter') parentLoginBtn?.click(); };

  const parentLogoutBtn = main.querySelector('#parentLogoutBtn');
  if(parentLogoutBtn) parentLogoutBtn.onclick = ()=>{
    state.parentLoggedInId = null;
    state.parentLoginInput = '';
    render();
  };

  const leftToggle = main.querySelector('#leftToggle');
  if(leftToggle) leftToggle.onchange = async ()=>{
    const admissionNo = state.parentLoggedInId;
    const today = todayStr();
    await setAttendance(admissionNo, today, {
      left: leftToggle.checked,
      leftTime: leftToggle.checked ? nowTime() : firebase.firestore.FieldValue.delete()
    });
    render();
  };

  const condSel = main.querySelector('#conductorRouteSelect');
  if(condSel) condSel.onchange = ()=>{ state.conductorRoute = condSel.value; render(); };

  main.querySelectorAll('[data-board-status]').forEach(sel=>{
    sel.onchange = async ()=>{
      const admissionNo = sel.dataset.boardStatus;
      const today = todayStr();
      const status = sel.value;
      if(!status){
        await setAttendance(admissionNo, today, {
          status: firebase.firestore.FieldValue.delete(),
          boardTime: firebase.firestore.FieldValue.delete()
        });
      } else if(status === 'boarded'){
        await setAttendance(admissionNo, today, {status:'boarded', boardTime: nowTime()});
      } else {
        await setAttendance(admissionNo, today, {status, boardTime: firebase.firestore.FieldValue.delete()});
      }
      render();
    };
  });

  const bunkBtn = main.querySelector('#bunkCheckBtn');
  if(bunkBtn) bunkBtn.onclick = async ()=>{
    const routeStudents = await getStudentsByRoute(state.conductorRoute);
    const today = todayStr();
    let flagged = 0;
    for(const s of routeStudents){
      const rec = await getAttendance(s.admissionNo, today);
      if(rec.left && !rec.status){
        await setAttendance(s.admissionNo, today, {status:'unaccounted'});
        await addAlert({
          kind: 'transport_unaccounted',
          studentId: s.admissionNo, studentName: s.name, admissionNo: s.admissionNo, route: s.route,
          date: today, time: nowTime(), ts: Date.now(), resolved: false
        });
        flagged++;
      }
    }
    alert(flagged ? `Flagged ${flagged} student(s) who left for the stop with no explanation on the bus. The school office has been alerted.` : 'No unaccounted students to flag.');
    render();
  };

  // van check-in
  main.querySelectorAll('[data-van-status]').forEach(sel=>{
    sel.onchange = async ()=>{
      const admissionNo = sel.dataset.vanStatus;
      const today = todayStr();
      const status = sel.value;
      if(!status){
        await setAttendance(admissionNo, today, {
          status: firebase.firestore.FieldValue.delete(),
          boardTime: firebase.firestore.FieldValue.delete()
        });
      } else if(status === 'arrived'){
        await setAttendance(admissionNo, today, {status:'arrived', boardTime: nowTime()});
      } else {
        await setAttendance(admissionNo, today, {status, boardTime: firebase.firestore.FieldValue.delete()});
      }
      render();
    };
  });

  main.querySelectorAll('[data-van-check]').forEach(btn=>{
    btn.onclick = async ()=>{
      const vanName = btn.dataset.vanCheck;
      const vanStudents = (await getVanStudents()).filter(s => (s.vanInfo || 'Unnamed van') === vanName);
      const today = todayStr();
      let flagged = 0;
      for(const s of vanStudents){
        const rec = await getAttendance(s.admissionNo, today);
        if(rec.left && !rec.status){
          await setAttendance(s.admissionNo, today, {status:'unaccounted'});
          await addAlert({
            kind: 'transport_unaccounted',
            studentId: s.admissionNo, studentName: s.name, admissionNo: s.admissionNo, route: vanName,
            date: today, time: nowTime(), ts: Date.now(), resolved: false
          });
          flagged++;
        }
      }
      alert(flagged ? `Flagged ${flagged} student(s) who left home with no arrival logged for this van. The school office has been alerted.` : 'No unaccounted students to flag.');
      render();
    };
  });

  // class attendance + cross-check
  const classAttendanceSelect = main.querySelector('#classAttendanceSelect');
  if(classAttendanceSelect) classAttendanceSelect.onchange = ()=>{ state.classAttendanceClass = classAttendanceSelect.value; render(); };

  main.querySelectorAll('[data-class-attendance]').forEach(sel=>{
    sel.onchange = async ()=>{
      const admissionNo = sel.dataset.classAttendance;
      const today = todayStr();
      const val = sel.value;
      if(!val){
        await setClassAttendance(admissionNo, today, {present: firebase.firestore.FieldValue.delete()});
        render();
        return;
      }
      const present = val === 'present';
      await setClassAttendance(admissionNo, today, {present});

      if(!present){
        const transportRec = await getAttendance(admissionNo, today);
        if(transportRec.status === 'boarded' || transportRec.status === 'arrived'){
          const student = await getStudentByAdmissionNo(admissionNo);
          const alertId = sanitizeAdm('classabsent__' + admissionNo + '__' + today);
          await setAlertById(alertId, {
            kind: 'transport_but_absent',
            studentId: admissionNo, studentName: student ? student.name : admissionNo, admissionNo,
            route: student ? (student.route || student.vanInfo || '') : '',
            date: today, time: nowTime(), ts: Date.now(), resolved: false
          });
        }
      }
      render();
    };
  });

  const regSel = main.querySelector('#registerStudentSelect');
  if(regSel) regSel.onchange = ()=>{ state.calStudentId = regSel.value; render(); };

  main.querySelectorAll('[data-cal-nav]').forEach(btn=>{
    btn.onclick = ()=>{
      const delta = parseInt(btn.dataset.calNav,10);
      state.calMonth += delta;
      if(state.calMonth < 0){ state.calMonth = 11; state.calYear--; }
      if(state.calMonth > 11){ state.calMonth = 0; state.calYear++; }
      render();
    };
  });
}

render();
</script>
</body>
</html>
